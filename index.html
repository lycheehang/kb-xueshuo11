<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的课表">
<title>我的课表 · 2026 秋</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    /* 色板＝设计基线 §1.5.2（iOS 系统色）。全页只 4 个彩色：蓝(必修) / 靛(选修) / 橙(调休补课) / 红(今天)，
       灰阶不计；每个颜色只承担一个语义，不串用。改色先改 设计基线，再改这里。 */
    --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --ink2:#6e6e73; --line:#e5e5ea;
    --must:#007aff; --mustbg:#eaf2ff; --elec:#5856d6; --elecbg:#efeffb;
    --warn:#c77800; --warnbg:#fff4e0; --off:#8e8e93; --offbg:#f2f2f7;
    --today:#ff3b30; --todaybg:#ffeceb; --todayline:#ffd6d3; --warnline:#ffdfb0;
    /* 阴影只用一层且极浅（设计基线 §3）；卡片靠底色分组区分，不靠灰影堆叠 */
    --shadow:0 1px 2px rgba(0,0,0,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",
    "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}

  /* ---------- 顶栏 ---------- */
  header.bar{
    position:sticky; top:0; z-index:20; background:rgba(244,246,250,.92);
    backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--line);
  }
  .bar-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{min-width:0}
  .brand h1{margin:0;font-size:20px;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nav-row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button,select{
    font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:7px 11px;cursor:pointer;transition:.15s;
  }
  button:hover,select:hover{border-color:var(--line);background:var(--bg)}
  button:active{transform:translateY(1px)}
  .nav .step{width:38px;text-align:center;font-size:17px;line-height:1;padding:8px 0}
  .nav select{padding:7px 8px;font-variant-numeric:tabular-nums}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:8px 13px;background:transparent;font-size:14px}
  .seg button.on{background:var(--must);color:#fff}
  .ghost{font-size:14px;color:var(--ink2)}

  /* ---------- 概览条 ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
  .chip b{color:var(--ink);font-weight:600}
  .chip .pl::before{content:'@'}
  .chip.today{border-color:var(--todayline);background:var(--todaybg);color:var(--today)}

  .banner{margin:14px 0 0;border-radius:var(--radius);padding:11px 14px;font-size:14px;display:none}
  .banner.show{display:block}
  .banner.off{background:var(--offbg);color:var(--ink2);border:1px solid var(--line)}
  .banner.mk{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnline)}

  /* ---------- 单周网格 ---------- */
  section{margin-top:18px}
  .grid{display:grid;gap:10px}
  .grid .corner,.grid .dayhead,.grid .blocklabel,.grid .cell{border-radius:var(--radius)}
  .dayhead{background:var(--card);border:1px solid var(--line);padding:9px 10px;text-align:center;box-shadow:var(--shadow)}
  .dayhead .d{font-weight:600;font-size:14px}
  .dayhead .dt{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .dayhead.today{border-color:var(--todayline);background:var(--todaybg)}
  .dayhead.today .d{color:var(--today)}
  .dayhead.off{background:var(--offbg);color:var(--off);box-shadow:none}
  .dayhead .tag{display:inline-block;margin-top:4px;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
  .dayhead.off .tag{background:var(--offbg);color:var(--ink2)}

  .blocklabel{background:transparent;border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--ink2);font-size:13px;padding:10px 4px;text-align:center}
  .blocklabel b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}

  .cell{background:var(--card);border:1px solid var(--line);min-height:92px;padding:9px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
  .cell.empty{background:var(--bg);border-style:dashed;box-shadow:none}
  .cell.off{background:var(--offbg);border-color:var(--line);box-shadow:none;align-items:center;justify-content:center;color:var(--off);font-size:13px}

  .course{border-left:4px solid var(--must);background:var(--mustbg);border-radius:10px;padding:8px 9px}
  .course.elec{border-left-color:var(--elec);background:var(--elecbg)}
  .course .nm{font-weight:600;font-size:14px;line-height:1.35}
  .course .tm{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:3px}
  .course .pl{font-size:13px;color:var(--ink);margin-top:1px}
  .course .nt{font-size:12px;color:var(--ink2);margin-top:5px;border-top:1px dashed rgba(0,0,0,.08);padding-top:4px}
  /* 节次（如 "1-4节"）绝不允许被拆成两行 —— 列窄时宁可行首下移 */
  .course .kd{font-size:12px;color:var(--ink2);opacity:.85;white-space:nowrap}

  /* ---------- 整学期视图 ---------- */
  .allwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;overflow:auto;box-shadow:var(--shadow)}
  table.all{border-collapse:separate;border-spacing:6px;width:100%;min-width:760px}
  table.all th{font-size:13px;color:var(--ink2);font-weight:600;padding:2px 4px;text-align:center}
  table.all td{vertical-align:top;padding:0}
  .wkbtn{width:100%;text-align:left;font-size:13px;padding:7px 8px;border-radius:10px;white-space:nowrap;background:var(--bg)}
  .wkbtn.now{background:var(--must);color:#fff;border-color:var(--must)}
  .wkbtn small{display:block;color:inherit;opacity:.7;font-size:12px;font-variant-numeric:tabular-nums}
  .mini{border-radius:10px;padding:6px 7px;font-size:12px;background:var(--mustbg);border-left:3px solid var(--must);min-height:34px;line-height:1.4}
  .mini.elec{background:var(--elecbg);border-left-color:var(--elec)}
  .mini.off{background:var(--offbg);border-left-color:var(--off);color:var(--off);text-align:center}
  .mini.mk{background:var(--warnbg);border-left-color:var(--warn);color:var(--warn)}
  .mini b{font-weight:600}
  .mini span{display:block;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .mini.off span,.mini.mk span{color:inherit;opacity:.8}

  footer{margin-top:22px;font-size:12px;color:var(--ink2);line-height:1.8}
  footer span{display:block}
  .f-touch{display:none}
  footer code{background:var(--offbg);border-radius:6px;padding:1px 6px;font-size:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
  [hidden]{display:none !important}

  /* ---------- 手机版（≤820px）：竖排大字，一屏看一天，不用横着拖 ---------- */
  .m-only{display:none}
  @media (max-width:820px){
    .d-only{display:none !important}
    .m-only{display:block}
    .wrap{padding:0 0 calc(28px + env(safe-area-inset-bottom))}
    header.bar{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(24px)}
    .bar-in{padding:10px 16px;gap:10px;align-items:stretch}
    .brand h1{font-size:22px;letter-spacing:0}
    .brand p{font-size:13px;line-height:1.4}
    .nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;width:100%}
    .nav .step{width:44px;height:44px;padding:0;border-radius:999px;font-size:22px;line-height:42px}
    .nav select{min-width:0;height:44px;border-radius:999px;padding:0 10px;font-size:16px;font-weight:600;text-align:center}
    .nav-row2{grid-column:1/-1;display:flex;gap:8px;align-items:center;width:100%}
    .nav-row2 .ghost{order:2;flex:0 0 auto;height:40px;border:0;border-radius:999px;background:rgba(0,122,255,.12);color:var(--must);font-weight:600}
    .nav-row2 .seg{order:1;flex:1 1 auto;min-width:0;border-radius:999px;padding:2px;background:var(--offbg)}
    .seg button{white-space:nowrap}
    .seg button{flex:1;height:40px;border-radius:999px;font-size:15px;font-weight:600}
    .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
    .chips{display:block;margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 14px}
    .chip{display:block;border:0;border-radius:0;background:transparent;padding:12px 0;font-size:15px;line-height:1.5;box-shadow:none}
    .chip + .chip{border-top:.5px solid rgba(60,60,67,.22)}
    .chip:last-child{display:none}
    .chip.today{background:transparent;border:0;color:var(--ink)}
    .chip.today b{color:var(--today)}
    .chip .pl::before{content:'教室 '}
    .banner{margin:12px 16px 0;font-size:14px;border-radius:16px;line-height:1.6}
    .mlist{margin-top:14px}
    .mday{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 16px 12px;padding:14px 14px 6px}
    .mday.today{border-color:var(--todayline);background:var(--todaybg)}
    .mday.off{background:var(--offbg);border-color:var(--line)}
    .mday.none{background:var(--bg);border-style:dashed;padding-bottom:14px}
    .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .mh .md{font-size:20px;font-weight:600}
    .mday.today .mh .md{color:var(--today)}
    .mday.off .mh .md{color:var(--off)}
    .mh .mdate{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
    .mh .mtag{margin-left:auto;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
    .mh .mtag.off{background:var(--offbg);color:var(--ink2)}
    .mh .mtag.today{background:var(--todaybg);color:var(--today)}
    .msess{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
    .msess + .msess{border-top:.5px solid rgba(60,60,67,.22)}
    .msess .mt{flex:none;width:100px;font-variant-numeric:tabular-nums}
    .msess .mt b{display:block;font-size:16px;font-weight:600}
    .msess .mt span{display:block;font-size:14px;color:var(--ink2)}
    .msess .mt i{display:block;font-size:13px;font-style:normal;color:var(--ink2);opacity:.8}
    .msess .mb{flex:1;min-width:0}
    .msess .mname{font-size:17px;font-weight:600;line-height:1.4}
    .msess .mname .pill{display:inline-block;vertical-align:1px;margin-right:6px;font-size:13px;font-weight:400;padding:2px 8px;border-radius:999px;background:var(--mustbg);color:var(--must)}
    .msess .mname .pill.elec{background:var(--elecbg);color:var(--elec)}
    .msess .mplace{font-size:15px;color:var(--ink);margin-top:3px}
    .msess .mplace em{font-style:normal;font-size:13px;color:var(--ink2);margin-right:6px}
    .msess .mnote{font-size:14px;color:var(--ink2);margin-top:5px;border-top:.5px dashed rgba(0,0,0,.10);padding-top:5px;line-height:1.6}
    .mempty{font-size:15px;color:var(--off);padding:6px 0 10px}
    .mtail{margin:2px 16px 0;font-size:14px;color:var(--ink2);line-height:1.7}
    .mweeks{margin-top:14px}
    .mw{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 16px 12px;padding:12px 14px;cursor:pointer}
    .mw.now{border-color:var(--must);background:var(--bg)}
    .mw.none{background:var(--bg);border-style:dashed}
    .mw.none .mwb{display:none}
    .mwh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .mwh b{font-size:17px;font-weight:600}
    .mwh span{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
    .mwh i{font-style:normal;margin-left:auto;font-size:13px;color:var(--ink2)}
    .mwh i.no{color:var(--off)}
    .mwb{margin-top:8px}
    .mwb:empty{display:none}
    .mwl{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.65;padding:3px 0}
    .mwl .w1{flex:none;width:44px;color:var(--ink2)}
    .mwl .w2{flex:none;width:48px;color:var(--ink2);font-variant-numeric:tabular-nums}
    .mwl .w3{font-weight:600}
    .mwl .w4{margin-left:auto;font-size:14px;color:var(--ink2);text-align:right}
    .mwl.elec .w3{color:var(--elec)}
    .mwl.off{color:var(--off)}
    .mwl.mk{color:var(--warn)}
    footer{margin:16px 16px 0;font-size:13px}
    .f-how,.f-key{display:none}
    .f-touch{display:block}
    .legend{margin:10px 16px 0}
  }
  @media print{
    header.bar{position:static;backdrop:none}
    .nav,.ghost,.seg{display:none !important}
    body{background:#fff}
    .cell,.dayhead,.course{box-shadow:none}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <h1 id="h1">我的课表</h1>
      <p id="sub"></p>
    </div>
    <div class="nav">
      <button class="step" id="prev" title="上一周（←）">‹</button>
      <select id="wk" title="选择第几周"></select>
      <button class="step" id="next" title="下一周（→）">›</button>
      <div class="nav-row2">
        <button class="ghost" id="now">回到本周</button>
        <div class="seg">
          <button id="tabWeek" class="on">单周</button>
          <button id="tabAll">整学期</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="banner" id="banner"></div>

  <section id="weekView" class="d-only">

  <section id="weekViewM" class="m-only">

  <section id="allView" class="d-only" hidden>

    <div class="legend">
      <span><i style="background:var(--must)"></i>必修</span>
      <span><i style="background:var(--elec)"></i>选修</span>
      <span><i style="background:var(--warn)"></i>调休补课</span>
      <span><i style="background:var(--off)"></i>放假</span>
    </div>
  </section>

  <section id="allViewM" class="m-only" hidden>
    <div class="mweeks" id="mweeks"></div>
    <div class="legend">
      <span><i style="background:var(--must)"></i>必修</span>
      <span><i style="background:var(--elec)"></i>选修</span>
      <span><i style="background:var(--warn)"></i>调休补课</span>
      <span><i style="background:var(--off)"></i>放假</span>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

const DAY_ORDER = [1,2,3,4,5,6,7];
const DOW_NAMES = {1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',7:'周日',0:'周日'};
DATA.dowNames = DOW_NAMES;
const $ = id => document.getElementById(id);
const byWeek = {};
for (const d of DATA.days) { (byWeek[d.week] = byWeek[d.week] || []).push(d); }
for (const k in byWeek) byWeek[k].sort((a,b) => a.dow - b.dow);

const todayStr = new Date().toLocaleDateString('sv-SE');           // yyyy-MM-dd（本地）
const todayDay = DATA.days.find(d => d.date === todayStr) || null;
const curWeek  = todayDay ? todayDay.week : (new Date(todayStr) < new Date(DATA.meta.firstMonday) ? 1 : DATA.meta.weeks);

function blockOf(s){ return s.from <= 4 ? 1 : (s.from <= 8 ? 2 : 3); }
function fmtRange(days){
  if (!days || !days.length) return '';
  const a = days[0].date.slice(5), b = days[days.length - 1].date.slice(5);
  return a.replace('-','/') + ' – ' + b.replace('-','/');
}
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------------- 单周视图 ---------------- */
function renderWeek(w){
  const days = byWeek[w] || [];
  const showWeekend = days.some(d => d.dow >= 6 && (d.sessions.length || d.makeup));
  const cols = DAY_ORDER.filter(d => d <= 5 || (showWeekend && d >= 6));
  const n = cols.length;

  const grid = $('grid');
  grid.style.gridTemplateColumns = `84px repeat(${n}, minmax(0,1fr))`;
  grid.style.setProperty('--n', String(n));
  let html = '<div class="corner"></div>';

  for (const dow of cols){
    const d = days.find(x => x.dow === dow) || {dow, date:'', holiday:false, sessions:[]};
    const isToday = d.date === todayStr;
    const cls = 'dayhead' + (isToday ? ' today' : '') + (d.holiday ? ' off' : '');
    const tag = d.makeup ? '<div class="tag">补 ' + esc(d.makeupOf.slice(5).replace('-','/')) + ' 的课</div>'
              : (d.holiday ? '<div class="tag">放假</div>' : (isToday ? '<div class="tag" style="background:var(--todaybg);color:var(--today)">今天</div>' : ''));
    html += `<div class="${cls}"><div class="d">${DATA.dowNames[dow]}${isToday?' · 今天':''}</div>
             <div class="dt">${esc(d.date.slice(5).replace('-','/'))}</div>${tag}</div>`;
  }

  for (const b of DATA.blocks){
    html += `<div class="blocklabel"><b>${esc(b.label)}</b>${esc(b.span)}</div>`;
    for (const dow of cols){
      const d = days.find(x => x.dow === dow);
      const list = d ? d.sessions.filter(s => blockOf(s) === b.no) : [];
      let cls = 'cell';
      if (d && d.holiday) cls += ' off';
      else if (!list.length) cls += ' empty';
      html += `<div class="${cls}">`;
      if (d && d.holiday) html += '放假';
      for (const s of list){
        const kind = (s.kind === '选修') ? ' elec' : '';
        html += `<div class="course${kind}">
            <div class="nm">${esc(s.name)}</div>
            <div class="tm">${esc(s.start)}–${esc(s.end)}　<span class="kd">${esc(s.span)}节</span></div>
            <div class="pl">${esc(s.place)}</div>
            ${s.note ? `<div class="nt">${esc(s.note)}</div>` : ''}
          </div>`;
      }
      html += '</div>';
    }
  }
  grid.innerHTML = html;
}

/* ---------------- 概览条 + 提示 ---------------- */
function renderChrome(w){
  const days = byWeek[w] || [];
  const cnt  = days.reduce((a,d) => a + d.sessions.length, 0);
  const off  = days.filter(d => d.holiday).length;
  const mk   = days.filter(d => d.makeup);

  $('h1').textContent = DATA.meta.title;
  const who = [DATA.meta.student, DATA.meta.className, DATA.meta.term].filter(x => x && String(x).trim());
  $('sub').textContent = `${who.join(' · ')}　|　第 ${w} 周（${fmtRange(days)}）`;

  const chips = [];
  if (todayDay){
    const ts = todayDay.sessions.map(s => s.short).join('、');
    const mkTxt = todayDay.makeup ? `（补 ${esc(todayDay.makeupOf.slice(5).replace('-','/'))} ${esc(todayDay.srcDowName)} 的课）` : '';
    chips.push(`<div class="chip today">今天 <b>${esc(todayDay.date.slice(5).replace('-','/'))} ${DATA.dowNames[todayDay.dow]}</b> · ${todayDay.holiday ? '放假' : (ts ? esc(ts) : '没课')}${mkTxt}</div>`);
  }
  chips.push(`<div class="chip">本周 <b>${cnt}</b> 次课${off ? ' · 放假 ' + off + ' 天' : ''}${mk.length ? ' · 调休补课 ' + mk.length + ' 天' : ''}</div>`);
  const next = DATA.days.find(d => d.date >= todayStr && d.sessions.length && d.sessions[0].start);
  if (next){
    const s = next.sessions[0];
    chips.push(`<div class="chip">下一节 <b>${esc(next.date.slice(5).replace('-','/'))} ${DATA.dowNames[next.dow]} ${esc(s.start)}</b> ${esc(s.short)}${s.placeShort ? ` <span class="pl">${esc(s.placeShort)}</span>` : ''}${next.makeup ? '（补课）' : ''}</div>`);
  }
  chips.push(`<div class="chip">共 <b>${DATA.meta.weeks}</b> 周 ｜ 学期 ${esc(DATA.meta.firstMonday.slice(5).replace('-','/'))} 起</div>`);
  $('chips').innerHTML = chips.join('');

  let bn = '';
  const offDays = days.filter(d => d.holiday);
  if (offDays.length){
    const range = offDays.map(d => d.date.slice(5).replace('-','/')).join('、');
    const label = (DATA.meta.holidayLabels || {})[offDays[0].date] || '放假';
    bn += `<div class="banner off show">${esc(label)}：<b>${range}</b> 停课放假（学校通知口径）。</div>`;
  }
  for (const d of mk){
    bn += `<div class="banner mk show"><b>${esc(d.date.slice(5).replace('-','/'))} ${DATA.dowNames[d.dow]}</b> 调休补课：
           按 <b>${esc(d.makeupOf.slice(5).replace('-','/'))}（${esc(d.srcDowName)}）</b>那天的课表上课（课表第 ${d.srcWeek} 周的内容）。</div>`;
  }
  $('banner').innerHTML = bn;
}

/* ---------------- 整学期视图 ---------------- */
function renderAll(){
  const cols = [1,2,3,4,5,6,7];
  const showWeekend = DATA.days.some(d => d.dow >= 6 && (d.sessions.length || d.makeup));
  const use = cols.filter(c => c <= 5 || showWeekend);
  let h = '<thead><tr><th></th>' + use.map(c => `<th>${DATA.dowNames[c]}</th>`).join('') + '</tr></thead><tbody>';
  for (let w = 1; w <= DATA.meta.weeks; w++){
    const days = byWeek[w] || [];
    h += `<tr><td><button class="wkbtn${w===curWeek?' now':''}" data-w="${w}">第 ${w} 周<small>${fmtRange(days)}</small></button></td>`;
    for (const c of use){
      const d = days.find(x => x.dow === c);
      if (!d){ h += '<td></td>'; continue; }
      if (d.holiday){ h += '<td><div class="mini off">放假</div></td>'; continue; }
      if (!d.sessions.length){ h += `<td><div class="mini${d.makeup?' mk':''}" style="background:var(--bg);border-left-color:var(--line);color:var(--off)">${d.makeup?'补':'—'}</div></td>`; continue; }
      const inner = d.sessions.map(s => `<b>${esc(s.short)}</b><span>${esc(s.start)} ${esc(s.placeShort||'')}</span>`).join('<div style="height:4px"></div>');
      h += `<td><div class="mini${d.sessions[0].kind==='选修'?' elec':''}${d.makeup?' mk':''}">${inner}</div></td>`;
    }
    h += '</tr>';
  }
  h += '</tbody>';
  $('allTable').innerHTML = h;
  $('allTable').querySelectorAll('button[data-w]').forEach(b => {
    b.onclick = () => { setWeek(+b.dataset.w); showTab('week'); };
  });
}

/* ---------------- 手机版：竖排日视图（不用横着拖） ---------------- */
function useWeekend(days){ return days.some(d => d.dow >= 6 && (d.sessions.length || d.makeup)); }

function renderWeekMobile(w){
  const days = byWeek[w] || [];
  const cols = DAY_ORDER.filter(d => d <= 5 || (useWeekend(days) && d >= 6));

  const shown = cols.filter(dow => {
    const d = days.find(x => x.dow === dow);
    return d && (d.sessions.length || d.makeup || d.holiday || d.date === todayStr);
  });
  const free = cols.filter(dow => {
    const d = days.find(x => x.dow === dow);
    return d && !d.sessions.length && !d.makeup && !d.holiday && d.date !== todayStr;
  });

  let html = '';
  for (let i = 0; i < shown.length; i++){
    const dow = shown[i];
    const d = days.find(x => x.dow === dow);
    const isToday = d.date === todayStr;

    // 连着的放假日合并成一张卡（周一 – 周三 放假）。
    // 不合并的话，国庆这种连休会让手机上连着滚三张"放假，没有课"的空卡。
    // 放假日正好是"今天"时不合并 —— 那天的"今天"标记比省空间重要。
    if (d.holiday && !isToday){
      let j = i;
      while (j + 1 < shown.length){
        const nd = days.find(x => x.dow === shown[j + 1]);
        if (!nd || !nd.holiday || nd.date === todayStr) break;
        j++;
      }
      const last = days.find(x => x.dow === shown[j]);
      const head = (j > i) ? `${DATA.dowNames[dow]} – ${DATA.dowNames[shown[j]]}` : DATA.dowNames[dow];
      const rg   = (j > i)
        ? `${d.date.slice(5).replace('-','/')} – ${last.date.slice(5).replace('-','/')}`
        : d.date.slice(5).replace('-','/');
      html += `<div class="mday off"><div class="mh"><span class="md">${head}</span>
               <span class="mdate">${esc(rg)}</span><span class="mtag off">放假</span></div>
               <div class="mbody"><div class="mempty">放假，没有课</div></div></div>`;
      i = j;
      continue;
    }

    const cls = 'mday' + (isToday ? ' today' : '') +
                (d.holiday ? ' off' : ((d.sessions.length || d.makeup) ? '' : ' none'));
    const tag = d.makeup ? `<span class="mtag">补 ${esc(d.makeupOf.slice(5).replace('-','/'))} 的课</span>`
              : (d.holiday ? '<span class="mtag off">放假</span>'
              : (isToday ? '<span class="mtag today">今天</span>' : ''));
    html += `<div class="${cls}"><div class="mh"><span class="md">${DATA.dowNames[dow]}</span>
             <span class="mdate">${esc(d.date.slice(5).replace('-','/'))}</span>${tag}</div><div class="mbody">`;

    if (d.holiday){
      html += '<div class="mempty">放假，没有课</div>';
    } else {
      for (const s of d.sessions){
        const kind = (s.kind === '选修') ? ' elec' : '';
        // ⚠️ 类别为空时**不能**留一个空的 pill —— 空的 <span class="pill"> 有 padding 与底色，
        //    会在课程名前面渲染成一小块蓝色色块（实测踩到）。没类别就整块不输出。
        const pill = s.kind ? `<span class="pill${kind}">${esc(s.kind)}</span>` : '';
        html += `<div class="msess">
            <div class="mt"><b>${esc(s.start)}</b><span>${esc(s.end)}</span><i>${esc(s.span)} 节</i></div>
            <div class="mb">
              <div class="mname">${pill}${esc(s.name)}</div>
              <div class="mplace"><em>教室</em>${esc(s.place)}</div>
              ${s.note ? `<div class="mnote">${esc(s.note)}</div>` : ''}
            </div></div>`;
      }
      if (!d.sessions.length) html += '<div class="mempty">没课</div>';
    }
    html += '</div></div>';
  }

  if (free.length) html += `<div class="mtail">本周没课的：${free.map(x => DATA.dowNames[x]).join('、')}。</div>`;
  $('mlist').innerHTML = html || '<div class="mtail">这一周还没有课表数据。</div>';
}

/* ---------------- 手机版：整学期（一周一张卡，点一下跳过去） ---------------- */
function renderAllMobile(){
  const use = [1,2,3,4,5].concat(useWeekend(DATA.days) ? [6,7] : []);
  let h = '';
  let w = 1;
  while (w <= DATA.meta.weeks){
    const days = byWeek[w] || [];
    const cnt = days.reduce((a,d) => a + d.sessions.length, 0);
    const mk  = days.filter(d => d.makeup).length;
    if (!cnt && !mk){
      // 连着"没课"的周合并成一张卡（第 1 – 2 周 没课），别白占好几张
      let j = w;
      while (j + 1 <= DATA.meta.weeks){
        const nd = byWeek[j + 1] || [];
        if (nd.reduce((a,d) => a + d.sessions.length, 0) || nd.filter(d => d.makeup).length) break;
        j++;
      }
      const a = (byWeek[w] || [])[0], b = (byWeek[j] || []).slice(-1)[0];
      const rg = (a && b) ? a.date.slice(5).replace('-','/') + ' – ' + b.date.slice(5).replace('-','/') : '';
      h += `<div class="mw none" data-w="${w}"><div class="mwh"><b>${j > w ? `第 ${w} – ${j} 周` : `第 ${w} 周`}</b>
            <span>${rg}</span><i class="no">没课</i></div><div class="mwb"></div></div>`;
      w = j + 1; continue;
    }
    h += `<div class="mw${w === curWeek ? ' now' : ''}" data-w="${w}">
      <div class="mwh"><b>第 ${w} 周</b><span>${fmtRange(days)}</span>
      <i class="${cnt ? '' : 'no'}">${cnt ? cnt + ' 次课' : '没课'}${mk ? ' · 补课' : ''}</i></div><div class="mwb">`;
    let i = 0;
    while (i < use.length){
      const c = use[i];
      const d = days.find(x => x.dow === c);
      if (!d){ i++; continue; }
      if (d.holiday){
        // 连着的放假日合并成一行（周五 – 周日 放假），别一天一张小条把卡片撑高
        let j = i;
        while (j < use.length){
          const dd = days.find(x => x.dow === use[j]);
          if (!dd || !dd.holiday) break;
          j++;
        }
        const tail = (j - i) > 1 ? ` – ${DATA.dowNames[use[j - 1]]}` : '';
        h += `<div class="mwl off"><span class="w1">${DATA.dowNames[c]}</span><span class="w2"></span>
              <span class="w3">${tail} 放假</span></div>`;
        i = j; continue;
      }
      for (const s of d.sessions){
        h += `<div class="mwl${s.kind === '选修' ? ' elec' : ''}">
              <span class="w1">${DATA.dowNames[c]}</span><span class="w2">${esc(s.start)}</span>
              <span class="w3">${esc(s.short || s.name)}</span><span class="w4">${esc(s.placeShort || '')}</span></div>`;
      }
      if (!d.sessions.length && d.makeup) h += `<div class="mwl mk"><span class="w1">${DATA.dowNames[c]}</span><span class="w2"></span><span class="w3">调休补课</span></div>`;
      i++;
    }
    h += '</div></div>';
    w++;
  }
  $('mweeks').innerHTML = h;
  $('mweeks').querySelectorAll('.mw').forEach(el => {
    el.onclick = () => { setWeek(+el.dataset.w); showTab('week'); };
  });
}

/* ---------------- 交互 ---------------- */
// 支持 课表.html?week=4 直接打开第 4 周（也可以 #w4）
const qs = new URLSearchParams(location.search).get('week') || (location.hash.match(/^#w(\d+)$/) || [])[1];
let viewWeek = +(qs || localStorage.getItem('tt.week') || 0) || curWeek;
function setWeek(w){
  viewWeek = Math.min(Math.max(w, 1), DATA.meta.weeks);
  localStorage.setItem('tt.week', viewWeek);
  $('wk').value = viewWeek;
  renderWeek(viewWeek); renderChrome(viewWeek); renderWeekMobile(viewWeek);
  if (window.matchMedia('(max-width:820px)').matches) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function showTab(which){
  const isWeek = which === 'week';
  $('weekView').hidden = !isWeek; $('allView').hidden = isWeek;
  $('weekViewM').hidden = !isWeek; $('allViewM').hidden = isWeek;
  $('tabWeek').classList.toggle('on', isWeek); $('tabAll').classList.toggle('on', !isWeek);
  localStorage.setItem('tt.tab', which);
  if (!isWeek) { renderAll(); renderAllMobile(); }
}

(function init(){
  const sel = $('wk');
  for (let w = 1; w <= DATA.meta.weeks; w++){
    const days = byWeek[w] || [];
    const o = document.createElement('option');
    o.value = w;
    o.textContent = `第 ${w} 周（${fmtRange(days)}）` + (days.some(d => d.holiday) ? ' · 假' : '') + (days.some(d => d.makeup) ? ' · 补课' : '');
    sel.appendChild(o);
  }
  sel.onchange = () => setWeek(+sel.value);
  $('prev').onclick = () => setWeek(viewWeek - 1);
  $('next').onclick = () => setWeek(viewWeek + 1);
  $('now').onclick  = () => setWeek(curWeek);
  $('tabWeek').onclick = () => showTab('week');
  $('tabAll').onclick  = () => showTab('all');
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  setWeek(viewWeek - 1);
    if (e.key === 'ArrowRight') setWeek(viewWeek + 1);
  });
  DATA.dowNames = DOW_NAMES;
  setWeek(viewWeek);
  $('foot').innerHTML =
    `<span class="f-meta">数据源 <code>${esc(DATA.meta.source)}</code>（排课口径唯一在 <code>课表核心.ps1</code>）　·　生成时间 ${esc(DATA.meta.generated)}</span>
     <span class="f-how">改课表：编辑 <code>课程表.json</code>（作息、放假、调休改 <code>课表配置.json</code>）后重新生成网页。</span>
     <span class="f-key">用 ← → 键或下拉框切换周次；放假与调休按学校通知自动标注。</span>
     <span class="f-touch">切换周次：点上方 ‹ › 或下拉框；点「整学期」里任意一周可直接跳过去。</span>`;
  showTab(new URLSearchParams(location.search).get('view') === 'all' ? 'all' : (localStorage.getItem('tt.tab') || 'week'));
})();
</script>
